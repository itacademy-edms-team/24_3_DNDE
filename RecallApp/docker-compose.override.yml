services:
  edge-proxy:
    ports:
      - "80:80"
      - "443:443"

  iam-db:
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  iam:
    command: start-dev
    environment:
      KC_HTTP_ENABLED: "true"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

  bff:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # bind-mount на Windows/WSL: события файлов не всегда доходят — polling для dotnet watch
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # секрет клиента Bff.Web из .env
      Oidc__ClientSecret: ${BFF_WEB_OIDC_CLIENT_SECRET}

  bff-tests:
    environment:
      # Keycloak-тесты: тестовый realm recallapp-test (Iam/README.md).
      # Секреты берём из .env
      KeycloakTests__Authority: https://auth.localhost/realms/recallapp-test
      KeycloakTests__ClientId: Bff.Web.Test
      KeycloakTests__ClientSecret: ${BFF_TEST_OIDC_CLIENT_SECRET}
      KeycloakTests__Username: testuser
      KeycloakTests__Password: ${BFF_TEST_USER_PASSWORD}
      # Пусто - все тесты; "Category!=Keycloak" - без Keycloak.
      TEST_FILTER: ${BFF_TEST_FILTER:-}

  app-db:
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_SUPERUSER_PASSWORD}
      # Инициализация ролей/схем модулей: см. init-скрипт App/scripts/01-roles-and-schemas.sh
      APP_DB_RUNTIME_PASSWORD: ${APP_DB_RUNTIME_PASSWORD}
      APP_DB_ACCOUNTS_OWNER_PASSWORD: ${APP_DB_ACCOUNTS_OWNER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # bind-mount на Windows/WSL: события файлов не всегда доходят — polling для dotnet watch
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Oidc__Authority: https://auth.localhost/realms/recallapp
      # runtime-подключение (app_runtime: только DML в accounts, без DDL)
      ConnectionStrings__Database: Host=app-db:5432;Database=app;Username=app_runtime;Password=${APP_DB_RUNTIME_PASSWORD}
      ConnectionStrings__AccountsMigrations: Host=app-db:5432;Database=app;Username=accounts_owner;Password=${APP_DB_ACCOUNTS_OWNER_PASSWORD}
      # миграции модулей применяются при старте dev-контейнера
      Database__ApplyMigrations: "true"

  app-tests:
    environment:
      # Тесты App: тестовая БД в app-db (runtime; owner - для миграций из тестов)
      ConnectionStrings__Database: Host=app-db:5432;Database=app;Username=app_runtime;Password=${APP_DB_RUNTIME_PASSWORD}
      ConnectionStrings__AccountsMigrations: Host=app-db:5432;Database=app;Username=accounts_owner;Password=${APP_DB_ACCOUNTS_OWNER_PASSWORD}
      Oidc__Authority: https://auth.localhost/realms/recallapp
      # Пусто - все тесты.
      TEST_FILTER: ${APP_TEST_FILTER:-}
