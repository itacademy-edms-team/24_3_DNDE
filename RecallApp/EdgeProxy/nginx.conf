events { worker_connections 1024; }

http {
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # WebSocket-upgrade: требуется для Vite HMR, SignalR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Общие прокси-заголовки
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 1. SPA (dev-сервер Vite)
    server {
        listen 443 ssl;
        http2 on;
        server_name app.recallapp.localhost;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location / {
            proxy_pass http://client-web:5173; # порт dev-сервера Vite по умолчанию
        }
    }

    # 2. BFF
    server {
        listen 443 ssl;
        http2 on;
        server_name bff.recallapp.localhost;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location / {
            proxy_pass http://bff:8080;
        }
    }

    # 3. IAM (Keycloak)
    server {
        listen 443 ssl;
        http2 on;
        server_name auth.localhost;
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location / {
            proxy_pass http://iam:8080;
            # Увеличенные буферы под тяжёлые OIDC-токены Keycloak
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }
    }

    # Перенаправление с HTTP на HTTPS
    server {
        listen 80;
        server_name app.recallapp.localhost bff.recallapp.localhost auth.localhost;
        return 301 https://$host$request_uri;
    }
}